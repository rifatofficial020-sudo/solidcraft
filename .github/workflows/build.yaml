
name: Build SolidCraft - Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Windows x64 Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            llvm \
            cmake \
            ninja-build \
            pkg-config \
            zip \
            unzip

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: Install cargo-xwin
        run: cargo install cargo-xwin --locked

      - name: Build SolidCraft Desktop
        run: |
          cargo xwin build \
            --release \
            --target x86_64-pc-windows-msvc \
            -p solidcraft

      - name: Build SolidCraft CLI
        run: |
          cargo xwin build \
            --release \
            --target x86_64-pc-windows-msvc \
            -p solidcraft-cli

      - name: Prepare Windows x64 artifacts
        shell: bash
        run: |
          mkdir -p dist

          cp target/x86_64-pc-windows-msvc/release/solidcraft.exe dist/
          cp target/x86_64-pc-windows-msvc/release/solidcraft-cli.exe dist/

          cd dist
          zip -r ../SolidCraft-Windows-x64.zip .

      - name: Upload Windows x64 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SolidCraft-Windows-x64
          path: SolidCraft-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload standalone executables
        uses: actions/upload-artifact@v4
        with:
          name: SolidCraft-Windows-x64-Executables
          path: |
            dist/solidcraft.exe
            dist/solidcraft-cli.exe
          if-no-files-found: error
          retention-days: 30
